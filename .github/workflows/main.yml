name: admpfr CI

on:
  push:
    branches:
    - main
    - main/**
  pull_request:
    branches:
    - main
  schedule:
    - cron: '0 0 * * 0' # weekly

jobs:
  macos:
    strategy:
      matrix:
        platform: [macos-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up deps
        run: |
          brew install mpfr
          python -m pip install e3-core e3-testsuite

      - name: Build and test
        run: |
          alr build
          alr exec -- ./testsuite/testsuite.py -E --failure-exit-code=1

  ubuntu:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      - name: Set up env
        run: |
          sudo apt install libmpfr-dev
          pip3 install e3-testsuite

      - name: Build and test admpfr
        run: |
          alr build
          alr exec -- ./testsuite/testsuite.py -E --failure-exit-code=1

  windows:
    strategy:
      matrix:
        platform: [windows-2022]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up git
        run: |
          git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      - name: Set up env
        run: |
          # Install e3-core and e3-testsuite from source to benefit from the rlimit bugfix
          pip install git+https://github.com/AdaCore/e3-core.git@master
          pip install git+https://github.com/AdaCore/e3-testsuite.git@master

      - name: Build and test admpfr
        run: |
          alr build
          alr exec -- python.exe .\testsuite\testsuite.py -E --failure-exit-code=1
